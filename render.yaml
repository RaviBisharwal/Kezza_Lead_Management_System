services:
  # ─────────────────────────────────────────────────────────────────
  # 1. Backend — Docker (Node.js + Chromium for whatsapp-web.js)
  # ─────────────────────────────────────────────────────────────────
  - type: web
    name: kezza-backend
    runtime: docker
    dockerfilePath: ./Whatsapp-Backend/Dockerfile
    dockerContext: ./Whatsapp-Backend
    plan: free
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "3000"
      - key: NODE_ENV
        value: production

      # ── Database (set these in Render Dashboard → Environment) ──
      - key: DB_HOST
        sync: false          # e.g. mysql-xxx.aivencloud.com
      - key: DB_PORT
        sync: false          # e.g. 12345
      - key: DB_USER
        sync: false          # e.g. avnadmin
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: lead_management_system
      - key: DB_SSL
        value: "true"        # Required for Aiven / cloud MySQL

      # ── WhatsApp / Puppeteer ──
      - key: PUPPETEER_EXECUTABLE_PATH
        value: /usr/bin/chromium
      - key: WWEBJS_AUTH_PATH
        value: ./.wwebjs_auth
      - key: WWEBJS_CACHE_PATH
        value: ./.wwebjs_cache

      # ── Google Sheets (optional) ──
      - key: GOOGLE_CREDENTIALS_JSON
        sync: false          # Paste full JSON of credentials.json in Render Dashboard

  # ─────────────────────────────────────────────────────────────────
  # 2. Frontend — Angular SSR (Node.js)
  # ─────────────────────────────────────────────────────────────────
  - type: web
    name: kezza-frontend
    runtime: node
    rootDir: Whatsapp-Frontend
    buildCommand: npm install && npm run build
    startCommand: npm run serve:ssr:whatsapp-frontend
    plan: free
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: PORT
        value: "4000"
