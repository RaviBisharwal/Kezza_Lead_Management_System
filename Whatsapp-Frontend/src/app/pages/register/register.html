<div class="register-container">

  <div class="register-card">

    <h1>Create Account</h1>

    <p class="subtitle">
      Join Kezza
    </p>

    <div class="form-group">

      <label>Full Name</label>

      <input
        type="text"
        [(ngModel)]="name"
        placeholder="Enter your name">

    </div>

    <div class="form-group">

      <label>Email</label>

      <input
        type="email"
        [(ngModel)]="email"
        placeholder="Enter your email">

    </div>

    <div class="form-group">

      <label>Password</label>

      <input
        type="password"
        [(ngModel)]="password"
        placeholder="Enter password">

    </div>

    <div class="form-group">

      <label>Select category</label>

      <select
    [(ngModel)]="category"
    (ngModelChange)="onCategoryChange()">

    <option value="" disabled>
        Select category
    </option>

    <option value="hair">Hair</option>
    <option value="skin">Skin</option>
    <option value="PMU">PMU</option>
    <option value="weight_loss">Weight Loss</option>

</select>

    </div>
    <div
    class="form-group"
    *ngIf="category">

    <label>
        Select Subcategories
    </label>

    <div
        *ngFor="
        let item of categoryOptions[category]
        ">

        <label>

            <input
                type="checkbox"
                (change)="
                toggleSubcategory(
                item,
                $any($event.target).checked
                )">

            {{ item }}

        </label>

    </div>

</div>
<div class="form-group">

  <label>Select Centre</label>

  <select [(ngModel)]="centre">

    <option value="" disabled>
      Select Centre
    </option>

    <option value="Jaipur">
      Jaipur
    </option>

    <option value="Sikar">
      Sikar
    </option>

  </select>

</div>

    <button
      class="register-btn"
      (click)="register()">

      Register

    </button>

    <div class="login-link">

      <p>
        Already have an account?
      </p>

      <a routerLink="/login">
        Login
      </a>

    </div>

  </div>

</div>
