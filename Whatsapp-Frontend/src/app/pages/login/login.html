<div class="auth-container">

  <div class="auth-card">

    <h1>Login</h1>

    <p>Welcome back</p>

    <form (ngSubmit)="login()">

      <div class="form-group">
        <label>Email</label>

        <input
        type="email"
        [(ngModel)]="email"
        name="email">
      </div>

      <div class="form-group">
        <label>Password</label>

        <input
        type="password"
        [(ngModel)]="password"
        name="password">
      </div>

      <button type="submit">
        Login
      </button>
      <br><br>
      <p class="register-text">
  New here?
  <a routerLink="/register">
    Create an account
  </a>
</p>

    </form>

  </div>

</div>
